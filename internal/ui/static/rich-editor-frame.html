<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"/>
  <style>
    html, body { height: 100%; margin: 0; background: #1a1a24; color: #e8e8f0; }
    #editor { height: 100%; }
    .toastui-editor-defaultUI { border: none; height: 100%; }
    .ProseMirror { min-height: 100%; font-size: 1rem; line-height: 1.65; padding: 0.75rem 1rem; }
    .ProseMirror h1 { font-size: 2rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    .ProseMirror h2 { font-size: 1.5rem; font-weight: 650; margin: 0.85rem 0 0.4rem; }
    .ProseMirror h3 { font-size: 1.2rem; font-weight: 600; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
  <script>
    let editor
    function initEditor(markdown) {
      if (editor?.destroy) editor.destroy()
      editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '100%',
        initialEditType: 'wysiwyg',
        hideModeSwitch: false,
        usageStatistics: false,
        initialValue: markdown || '',
        toolbarItems: [
          ['heading', 'bold', 'italic', 'strike'],
          ['hr', 'quote'],
          ['ul', 'ol', 'task'],
          ['table', 'link'],
          ['code', 'codeblock'],
        ],
      })
    }
    window.setMarkdown = (md) => { if (!editor) initEditor(md); else editor.setMarkdown(md || '') }
    window.getMarkdown = () => editor ? editor.getMarkdown() : ''
    window.initEditor = initEditor
    function bindChange() {
      if (!editor) return
      editor.off('change')
      editor.on('change', () => {
        if (window.webkit?.messageHandlers?.content) {
          window.webkit.messageHandlers.content.postMessage(getMarkdown())
        }
      })
    }
    const _init = initEditor
    initEditor = (md) => { _init(md); bindChange() }
    if (window.webkit?.messageHandlers?.ready) {
      window.webkit.messageHandlers.ready.postMessage('ready')
    }
  </script>
</body>
</html>
